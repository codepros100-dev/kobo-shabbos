; KFMon configuration for the Shabbos Dashboard.
; Place at: /mnt/onboard/.adds/kfmon/config/dashboard.ini
;
; KFMon will create a "book" entry that, when tapped in Nickel's library,
; launches our dashboard loop.

[main]
; The "trigger" file shown in Nickel's library. We use a 1-pixel PNG so it
; appears as a tappable item. The actual launch happens when this file is
; opened.
filename = /mnt/onboard/Dashboard.png

; The script we launch.
action = /mnt/onboard/.adds/dashboard/dashboard-loop.sh

; Don't try to "process" the file — just launch the action.
do_db_update = 0

; Hide a console while running (no UI).
hidden = 1

; Run the action in the background; the loop is long-running.
[watch]
; Re-trigger if the file is touched again (lets the user "restart" by tapping)
do_db_update = 0
block_spawns = 1
