name: publish-dashboard

# Renders the live Shabbos page hourly and force-pushes it to the `dashboard`
# branch, which the Kobo fetches from raw.githubusercontent.com.
on:
  schedule:
    # GitHub drops most scheduled runs on small repos (observed: 3 of 22 hourly
    # runs fired), so ask four times an hour; a render takes ~20 s.
    # The device refreshes at :25 and ignores a page older than 3 h.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/workflows/publish-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt

      - name: Install deps
        run: |
          sudo apt-get install -y --no-install-recommends libfribidi0
          pip install -r generator/requirements.txt

      - name: Render live page
        run: |
          mkdir out
          python generator/generate_dashboard.py live \
            --out out/dashboard.png --stamp out/dashboard.txt

      - name: Publish to dashboard branch
        run: |
          cd out
          git init -q -b dashboard
          git config user.name  "kobo-bot"
          git config user.email "kobo-bot@users.noreply.github.com"
          git add dashboard.png dashboard.txt
          git commit -q -m "dashboard: $(date -u +%FT%TZ)"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            dashboard
